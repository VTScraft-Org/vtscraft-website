<div class="min-h-screen bg-[#0D1B2A] flex items-center justify-center px-4 py-12 relative overflow-hidden">
  
  <!-- Subtle ambient glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#27AE60]/10 rounded-full blur-[140px] pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    
    <!-- Logo & Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl overflow-hidden bg-white/10 p-2 border border-white/20 mx-auto mb-4 shadow-xl">
        <img src="/images/logo.png" alt="VTScraft" class="w-full h-full object-contain" />
      </div>
      <h1 class="text-2xl sm:text-3xl font-black text-white tracking-tight">VTScraft Admin</h1>
      <p class="text-xs text-[#27AE60] uppercase tracking-widest font-mono font-bold mt-1">SECURE MANAGEMENT CONSOLE</p>
    </div>

    <!-- Centered Card -->
    <div class="bg-white/5 border border-white/10 rounded-3xl p-8 shadow-2xl backdrop-blur-md">
      <form (ngSubmit)="onSubmit()" #f="ngForm" class="space-y-5">
        
        <div>
          <label for="admin-email" class="block text-xs font-bold uppercase tracking-wider text-white/70 mb-2">Email</label>
          <input
            id="admin-email"
            type="email"
            name="email"
            [(ngModel)]="username"
            required
            autocomplete="email"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/15 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-[#27AE60] focus:border-transparent text-sm transition-all"
            placeholder="admin@example.com"
          />
        </div>

        <div>
          <label for="admin-password" class="block text-xs font-bold uppercase tracking-wider text-white/70 mb-2">Password</label>
          <input
            id="admin-password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/15 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-[#27AE60] focus:border-transparent text-sm transition-all"
            placeholder="••••••••••••"
          />
        </div>

        @if (error()) {
          <div class="px-4 py-3 rounded-xl bg-red-500/15 border border-red-500/30 text-red-400 text-xs">
            {{ error() }}
          </div>
        }

        <button
          type="submit"
          id="admin-login-btn"
          [disabled]="loading() || !f.form.valid"
          class="w-full py-3.5 rounded-xl bg-[#27AE60] hover:bg-[#219653] text-white font-bold text-sm disabled:opacity-60 disabled:cursor-not-allowed transition-all duration-200 shadow-lg shadow-[#27AE60]/25 cursor-pointer"
        >
          @if (loading()) { Authenticating… } @else { Sign In to Dashboard → }
        </button>
      </form>
    </div>

    <!-- Back to public site -->
    <div class="text-center mt-6">
      <a routerLink="/" class="text-xs text-white/50 hover:text-white transition-colors">
        ← Return to VTScraft Website
      </a>
    </div>

  </div>
</div>
