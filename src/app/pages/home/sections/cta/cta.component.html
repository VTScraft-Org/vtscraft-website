<section id="cta" class="final-cta-section relative py-24 sm:py-32 overflow-hidden text-center text-white">
  
  <!-- Dark photo / grid / mesh overlay background -->
  <div class="cta-bg-layer absolute inset-0 z-0">
    <div class="absolute inset-0 bg-[#0D1B2A]/90 backdrop-blur-sm z-10"></div>
    <!-- Mesh gradient glows -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] bg-gradient-to-r from-[#27AE60]/20 via-[#1A3A6B]/30 to-[#27AE60]/20 rounded-full blur-[140px] z-10 pointer-events-none"></div>
    <!-- Isometric network grid texture -->
    <div class="isometric-grid-texture absolute inset-0 opacity-15 z-0 pointer-events-none"></div>
  </div>

  <div class="relative z-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Small caps green overline -->
    <div class="inline-block mb-4 sm:mb-6">
      <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-[#27AE60]/40 text-xs font-bold uppercase tracking-[0.25em] text-[#27AE60] shadow-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-[#27AE60]"></span>
        CRAFTING DIGITAL EXCELLENCE
      </span>
    </div>

    <!-- H2 White + Green highlight -->
    <h2 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold text-white tracking-tight leading-[1.12] mb-6">
      Ready to craft something<br />
      <span class="text-[#27AE60]">that moves with you?</span>
    </h2>

    <!-- Subtext white -->
    <p class="text-base sm:text-lg text-white/80 max-w-xl mx-auto mb-10 sm:mb-12 font-medium">
      No obligation on the first call.
    </p>

    <!-- 3 Buttons: Dark pill | Outline white | WhatsApp Us (green pill with icon) -->
    <div class="cta-btn-group flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-5 flex-wrap">
      
      <!-- 1. Book a Discovery Call (dark pill) -->
      <a
        routerLink="/contact"
        class="w-full sm:w-auto px-8 py-4 rounded-full bg-[#0D1B2A] border border-white/20 hover:border-[#27AE60] text-white font-bold text-sm sm:text-base shadow-xl hover:-translate-y-0.5 transition-all duration-300 inline-flex items-center justify-center gap-2 cursor-pointer group"
      >
        <span>Book a Discovery Call</span>
        <svg class="w-4 h-4 text-[#27AE60] group-hover:translate-x-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </a>

      <!-- 2. See Our Work (outline white) -->
      <a
        routerLink="/work"
        class="w-full sm:w-auto px-8 py-4 rounded-full border-2 border-white text-white hover:bg-white hover:text-[#0D1B2A] font-bold text-sm sm:text-base transition-all duration-300 hover:-translate-y-0.5 inline-flex items-center justify-center gap-2 cursor-pointer shadow-lg"
      >
        <span>See Our Work</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
        </svg>
      </a>

      <!-- 3. WhatsApp Us (green pill with icon) -->
      <a
        [href]="'https://wa.me/' + whatsappNumber + '?text=' + whatsappMessage"
        target="_blank"
        rel="noopener noreferrer"
        class="w-full sm:w-auto px-8 py-4 rounded-full bg-[#25D366] hover:bg-[#20ba5a] text-white font-bold text-sm sm:text-base shadow-xl shadow-[#25D366]/30 hover:-translate-y-0.5 transition-all duration-300 inline-flex items-center justify-center gap-2.5 cursor-pointer"
      >
        <!-- WhatsApp SVG Icon -->
        <svg class="w-5 h-5 flex-shrink-0" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.976.58 2.028.928 3.149.929 3.182 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.768-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86.174.086.275.072.376-.043.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.203c.043.072.043.419-.101.824z"/>
        </svg>
        <span>WhatsApp Us</span>
      </a>

    </div>

  </div>
</section>
