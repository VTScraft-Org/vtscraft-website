<section id="clients" class="client-logos-section bg-white py-12 sm:py-16 relative overflow-hidden border-y border-gray-100">
  
  <!-- Left and right gradient masks for seamless fade out -->
  <div class="pointer-events-none absolute inset-y-0 left-0 w-24 sm:w-40 bg-gradient-to-r from-white to-transparent z-10"></div>
  <div class="pointer-events-none absolute inset-y-0 right-0 w-24 sm:w-40 bg-gradient-to-l from-white to-transparent z-10"></div>

  <!-- Marquee container -->
  <div class="marquee-track flex items-center gap-8 sm:gap-12 w-max">
    
    <!-- First set of 6 logo boxes -->
    @for (logo of logos; track $index) {
      <div class="logo-box flex items-center justify-center gap-3 w-48 sm:w-56 h-16 sm:h-20 rounded-xl bg-gray-100/80 hover:bg-gray-200/80 border border-gray-200/60 px-6 transition-all duration-200 flex-shrink-0 cursor-default group">
        <div class="w-8 h-8 rounded-lg bg-gray-300 group-hover:bg-[#27AE60] transition-colors duration-200 flex items-center justify-center text-xs font-black text-gray-700 group-hover:text-white">
          {{ logo.symbol }}
        </div>
        <span class="text-sm font-bold tracking-wider text-gray-500 group-hover:text-[#0D1B2A] transition-colors duration-200 uppercase font-mono">
          {{ logo.name }}
        </span>
      </div>
    }

    <!-- Duplicate set for seamless infinite loop -->
    @for (logo of logos; track 'dup-' + $index) {
      <div class="logo-box flex items-center justify-center gap-3 w-48 sm:w-56 h-16 sm:h-20 rounded-xl bg-gray-100/80 hover:bg-gray-200/80 border border-gray-200/60 px-6 transition-all duration-200 flex-shrink-0 cursor-default group">
        <div class="w-8 h-8 rounded-lg bg-gray-300 group-hover:bg-[#27AE60] transition-colors duration-200 flex items-center justify-center text-xs font-black text-gray-700 group-hover:text-white">
          {{ logo.symbol }}
        </div>
        <span class="text-sm font-bold tracking-wider text-gray-500 group-hover:text-[#0D1B2A] transition-colors duration-200 uppercase font-mono">
          {{ logo.name }}
        </span>
      </div>
    }

    <!-- Triplicate set to ensure wide-screen coverage -->
    @for (logo of logos; track 'trip-' + $index) {
      <div class="logo-box flex items-center justify-center gap-3 w-48 sm:w-56 h-16 sm:h-20 rounded-xl bg-gray-100/80 hover:bg-gray-200/80 border border-gray-200/60 px-6 transition-all duration-200 flex-shrink-0 cursor-default group">
        <div class="w-8 h-8 rounded-lg bg-gray-300 group-hover:bg-[#27AE60] transition-colors duration-200 flex items-center justify-center text-xs font-black text-gray-700 group-hover:text-white">
          {{ logo.symbol }}
        </div>
        <span class="text-sm font-bold tracking-wider text-gray-500 group-hover:text-[#0D1B2A] transition-colors duration-200 uppercase font-mono">
          {{ logo.name }}
        </span>
      </div>
    }

  </div>
</section>
